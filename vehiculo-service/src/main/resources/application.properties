spring.application.name=vehiculo-service
server.port=8081

# H2 en archivo: los datos sobreviven al reinicio del servicio.
# Alternativa en memoria: spring.datasource.url=jdbc:h2:mem:parqueaderodb
spring.datasource.url=jdbc:h2:file:./data/parqueaderodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
